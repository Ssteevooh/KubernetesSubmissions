name: Release project

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: dwk-gke-506008
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  GAR_LOCATION: europe-north1
  GAR_REPOSITORY: my-repository
  IMAGE: the_project

jobs:
  build-publish-deploy:
    name: Build, publish and deploy
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker $GAR_LOCATION-docker.pkg.dev

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials $GKE_CLUSTER --zone $GKE_ZONE --project $PROJECT_ID

      - name: Build image
        run: docker build -t $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE:$GITHUB_SHA ./the_project

      - name: Publish image
        run: docker push $GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE:$GITHUB_SHA

      - name: Set image
        run: kustomize edit set image the_project=$GAR_LOCATION-docker.pkg.dev/$PROJECT_ID/$GAR_REPOSITORY/$IMAGE:$GITHUB_SHA

      - name: Deploy
        run: kubectl apply -k .
