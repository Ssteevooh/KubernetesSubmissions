<div style="text-align: center; font-family: Arial">
  <h1>Todo App</h1>

  <img src="/theproject/image" width="300" />

  <form action="/theproject/todos" method="post" style="margin-top: 20px">
    <input
      name="todo"
      maxlength="140"
      placeholder="Enter a new todo (max 140 characters)"
      style="width: 300px"
    />
    <button>Send</button>
  </form>

  <h2>Todos</h2>

  <ul style="display: inline-block; text-align: left">
    {{todos}}
  </ul>
</div>
